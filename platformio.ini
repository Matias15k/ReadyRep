; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32c3

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<adc_test.cpp> -<ReadyRep.cpp> -<ReadyRepBLE.cpp>

; Standalone A0 reading test: pio run -e adc_test -t upload -t monitor
[env:adc_test]
extends = env:seeed_xiao_esp32c3
build_src_filter = +<adc_test.cpp>

; EMG + thermistor + record button: pio run -e readyrep -t upload -t monitor
[env:readyrep]
extends = env:seeed_xiao_esp32c3
build_src_filter = +<ReadyRep.cpp>

; EMG median frequency over BLE (nRF Connect) + serial: pio run -e readyrep_ble -t upload -t monitor
[env:readyrep_ble]
extends = env:seeed_xiao_esp32c3
build_src_filter = +<ReadyRepBLE.cpp>
